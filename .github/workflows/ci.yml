name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    # Pinned, not ubuntu-latest (prism-ios#72): ubuntu-latest moved to Ubuntu 26.04, and
    # swift-actions/setup-swift v2.4.0 (the latest stable release) refuses it with
    # 'Version "26.04" of Ubuntu is not supported'. vivijure-ios pins 24.04 for the same reason.
    # Move back to ubuntu-latest when a setup-swift release supports 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Swift
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: "5.10"
      - run: swift test
