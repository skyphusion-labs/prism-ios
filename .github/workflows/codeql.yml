name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CodeQL:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # fc#1652: scripts/embed-legal.py was unanalysed. It is small (949 bytes by
          # the linguist census) and it is still real code that runs in the release
          # path; python is a no-build extractor, so covering it costs a matrix row.
          # The swift residual is a SEPARATE and deliberate one, recorded as a declared
          # exception in fleet-chezmoi system/ci/codeql-language-exceptions.tsv rather
          # than silently omitted.
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
