version: 2

# skyphusion-labs Dependabot standard — see fleet-chezmoi/docs/runbooks/dependabot-standard.md
# PRs only (never auto-merge). Group minor/patch; majors stay separate.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # setup-swift@v3 is beta; GPG verify fails on GHA ubuntu
    # (swift-actions/setup-swift#798). Pin v2 until v3 is production-ready.
    ignore:
      - dependency-name: "swift-actions/setup-swift"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      swift-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
