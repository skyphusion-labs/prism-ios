name: Prism
options:
  bundleIdPrefix: org.skyphusion
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PrismKitLocal:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.8.9"
    CURRENT_PROJECT_VERSION: "24"
    # Personal Apple Developer Program Team ID (individual membership, not an org)
    DEVELOPMENT_TEAM: "858878N47M"
    CODE_SIGN_STYLE: Automatic

targets:
  Prism:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
        excludes:
          - Info.plist
          - Legal/**
    resources:
      - path: App/Assets.xcassets
      # LICENSE text is compiled into BundledLegalText.swift (XcodeGen was not
      # copying bare legal files into the Resources phase on this project).
    dependencies:
      - package: PrismKitLocal
        product: PrismKit
      - target: PrismWidget
    entitlements:
      path: App/Prism.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.skyphusion.prism
        PRODUCT_NAME: Prism
        DEVELOPMENT_TEAM: "858878N47M"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Prism
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save generated images to your photo library."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos as reference images for image-to-image and image-to-video."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record audio to transcribe with speech-to-text models."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to attach for vision chat or image-to-video."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock Prism when biometric lock is enabled."
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Prism.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Prism
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSPhotoLibraryAddUsageDescription: "Save generated images to your photo library."
        NSPhotoLibraryUsageDescription: "Attach photos as reference images for image-to-image and image-to-video."
        NSMicrophoneUsageDescription: "Record audio to transcribe with speech-to-text models."
        NSCameraUsageDescription: "Take a photo to attach for vision chat or image-to-video."
        NSFaceIDUsageDescription: "Unlock Prism when biometric lock is enabled."

  PrismWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Widget
        excludes:
          - Info.plist
    entitlements:
      path: Widget/PrismWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.skyphusion.prism.widget
        PRODUCT_NAME: PrismWidget
        DEVELOPMENT_TEAM: "858878N47M"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.8.9"
        CURRENT_PROJECT_VERSION: "24"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widget/PrismWidget.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Prism
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Prism:
    build:
      targets:
        Prism: all
        PrismWidget: all
    run:
      config: Debug
      # Local IAP testing without App Store sandbox account
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
